[build-system]
requires = ['setuptools>=68.0', 'wheel']
build-backend = 'setuptools.build_meta'

[project]
name = 'mentiora-ai-sdk'
version = '0.1.0'
description = 'Official SDK for the Mentiora platform - AI observability and tracing'
readme = 'README.md'
requires-python = '>=3.11'
license = 'Apache-2.0'
license-files = ['LICENSE']
authors = [
    {name = 'Mentiora'},
]
keywords = [
    'mentiora',
    'sdk',
    'python',
    'tracing',
    'observability',
    'ai',
    'llm',
    'monitoring',
]
classifiers = [
    'Development Status :: 4 - Beta',
    'Intended Audience :: Developers',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Topic :: Software Development :: Libraries :: Python Modules',
    'Typing :: Typed',
]

dependencies = [
    'httpx>=0.28.1',
    'pydantic>=2.12.5',
]

[project.optional-dependencies]
openai = [
    'openai>=2.15.0',
]
langchain = [
    'langchain>=1.2.6',
    'langchain-core>=1.2.6',
]
dev = [
    'pytest>=9.0.2',
    'pytest-asyncio>=1.3.0',
    'pytest-mock>=3.14.0',
    'pytest-httpx>=0.36.0',
    'ruff>=0.14.14',
    'mypy>=1.19.1',
]

[project.urls]
Homepage = 'https://github.com/mentiora-ai/mentiora-sdk'
Repository = 'https://github.com/mentiora-ai/mentiora-sdk'
Documentation = 'https://docs.mentiora.ai/python/installation'
Issues = 'https://github.com/mentiora-ai/mentiora-sdk/issues'

[tool.setuptools]
package-dir = {'' = 'src'}

[tool.setuptools.packages.find]
where = ['src']

[tool.ruff]
line-length = 100
target-version = 'py311'

[tool.ruff.lint]
select = [
    'E',  # pycodestyle errors
    'W',  # pycodestyle warnings
    'F',  # pyflakes
    'I',  # isort
    'B',  # flake8-bugbear
    'C4', # flake8-comprehensions
    'UP', # pyupgrade
]
ignore = [
    'E501', # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = 'single'
indent-style = 'space'

[tool.ruff.lint.isort]
known-first-party = ['mentiora']

[tool.mypy]
python_version = '3.11'
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
show_error_codes = true
plugins = ['pydantic.mypy']

[[tool.mypy.overrides]]
module = [
    'langchain_core.*',
    'openai.*',
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ['tests']
python_files = ['test_*.py']
python_classes = ['Test*']
python_functions = ['test_*']
asyncio_mode = 'auto'
addopts = [
    '-v',
    '--strict-markers',
    '--tb=short',
]
